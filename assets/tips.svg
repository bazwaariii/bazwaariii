<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="900" height="100" role="img" aria-label="Dev tip of the day: tips ngoding yang berganti otomatis" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}.tw{animation:tw 2.4s steps(2) infinite}.bl{animation:bl 1s steps(1) infinite}.bob{animation:bob 1.2s steps(1) infinite}.pg{transform-box:fill-box;transform-origin:left center;animation:pg 4s steps(20) infinite}@keyframes pg{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="900" height="100" fill="#0d1124"/>
<rect x="2" y="2" width="896" height="96" fill="#181d38" stroke="#2b3263" stroke-width="4"/>
<g shape-rendering="crispEdges" class="bl"><rect x="28" y="28" width="20" height="5" fill="#ffd166"/><rect x="23" y="33" width="30" height="5" fill="#ffd166"/><rect x="23" y="38" width="30" height="5" fill="#ffd166"/><rect x="23" y="43" width="30" height="5" fill="#ffd166"/><rect x="28" y="48" width="20" height="5" fill="#ffd166"/><rect x="28" y="53" width="20" height="5" fill="#a3abd6"/><rect x="28" y="58" width="20" height="5" fill="#a3abd6"/><rect x="33" y="63" width="10" height="5" fill="#a3abd6"/></g>
<text x="70" y="34" font-size="12" font-weight="700" fill="#4fd1c5" letter-spacing="2">DEV TIP OF THE DAY</text>
<text x="70" y="62" font-size="16" fill="#e8ecff" opacity="0">Commit kecil, commit sering. Riwayat git-mu akan berterima kasih.<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.25;.5;.75" values="1;0;0;0"/></text><text x="70" y="62" font-size="16" fill="#e8ecff" opacity="0">Baca error message sampai habis. Jawabannya sering sudah ada di sana.<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.25;.5;.75" values="0;1;0;0"/></text><text x="70" y="62" font-size="16" fill="#e8ecff" opacity="0">Tulis README sebelum lupa kenapa kode ini dibuat.<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.25;.5;.75" values="0;0;1;0"/></text><text x="70" y="62" font-size="16" fill="#e8ecff" opacity="0">Istirahat itu fitur, bukan bug. Tidur cukup bikin kode lebih rapi.<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.25;.5;.75" values="0;0;0;1"/></text>
<rect x="70" y="80" width="800" height="6" fill="#10142b"/><rect class="pg" x="70" y="80" width="800" height="6" fill="#ffd166"/>
</svg>
