<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Muhammad Bazwa Arigusna — Fullstack Developer, Machine Learning Engineer, UI/UX Designer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}
.tw{animation:tw 2.4s steps(2) infinite}
.bl{animation:bl 1s steps(1) infinite}
.fl{animation:fl 2s steps(2) infinite}
.st{animation:st 2.4s steps(4) infinite}
.ty{animation:ty .5s steps(1) infinite}
.ln{transform-box:fill-box;transform-origin:left center;animation:cd 3s steps(6) infinite}
.sw{animation:sw 3s steps(2) infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes st{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-3px);opacity:0}}
@keyframes ty{0%,100%{transform:translateY(0)}50%{transform:translateY(.6px)}}
@keyframes cd{0%,100%{transform:scaleX(.35)}50%{transform:scaleX(1)}}
@keyframes sw{0%,100%{transform:translateX(0)}50%{transform:translateX(.5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
